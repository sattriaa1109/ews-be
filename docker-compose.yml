version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ews_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app

  db:
    image: postgres:16-alpine
    container_name: ews_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ews_user
      POSTGRES_PASSWORD: ews_pass
      POSTGRES_DB: ews_db
    volumes:
      - ews_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ews_user -d ews_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ews_pgdata:
